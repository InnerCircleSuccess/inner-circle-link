<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inner Circle | Elite Access</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #050505;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #d4af37, #f3e5ab);
            margin: 0 auto 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: #000;
            font-weight: 600;
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.2);
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            letter-spacing: 1px;
        }

        p {
            font-size: 0.9rem;
            color: #888;
            margin-bottom: 2.5rem;
        }

        .link-btn {
            display: block;
            width: 100%;
            padding: 1rem;
            margin-bottom: 1rem;
            background-color: #111;
            color: #fff;
            text-decoration: none;
            border: 1px solid #333;
            border-radius: 8px;
            font-weight: 400;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .link-btn:hover {
            border-color: #d4af37;
            background-color: #1a1a1a;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.1);
        }

        .highlight-btn {
            background: linear-gradient(135deg, #d4af37, #aa8623);
            color: #000;
            font-weight: 600;
            border: none;
        }

        .highlight-btn:hover {
            background: linear-gradient(135deg, #e5c158, #bf972a);
            color: #000;
        }
        
        .footer {
            margin-top: 3rem;
            font-size: 0.75rem;
            color: #444;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="profile-img">IC</div>
        <h1>THE INNER CIRCLE</h1>
        <p>Design your lifestyle. Build your network.</p>

        <!-- Highlighted Main Offer -->
        <a href="https://v2.bellatorlife.com/sign-up?referral=InnerCircleSuccess" class="link-btn highlight-btn" target="_blank">
            Join Bellator Life (V2 Access)
        </a>

        <!-- Secondary Offer -->
        <a href="https://www.bellatorlife.com/register?reference=InnerCircleSuccess" class="link-btn" target="_blank">
            Bellator Original Registration
        </a>

        <!-- Third Offer -->
        <a href="https://bglifestyle.com/?ref=aso" class="link-btn" target="_blank">
            Unlock BG Lifestyle
        </a>

        <div class="footer">
            © 2024 Inner Circle Success. All rights reserved.
        </div>
    </div>

</body>
</html>
